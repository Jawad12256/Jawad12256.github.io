name: Deploy to GitHub Pages

# Single, official GitHub Pages pipeline for the nested `my-app/` CRA app.
#
# This uses GitHub's native Pages deployment (upload-pages-artifact +
# deploy-pages) instead of pushing to a `gh-pages` branch. That removes
# the previous dual-pipeline setup (our workflow + GitHub's legacy
# branch-based "pages build and deployment"), which was the source of
# intermittent "Deployment failed, try again later" stalls.
#
# REQUIRES a one-time repo setting:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# Runs on manual dispatch, and automatically on pushes to main.

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        # CI defaults to true on GitHub Actions, so CRA treats warnings
        # as errors. The source is kept warning-clean so this passes.
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: my-app/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
